<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kontakt | Frehiwet Fishaye Portfolio</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="site-header">
        <a href="index.html" class="logo">Home</a>
        <nav class="main-nav">
            <ul>
                <li><a href="index.html">Start</a></li>
                <li><a href="om-mig.html">Om mig</a></li>
                <li><a href="kontakt.html" class="active">Kontakt</a></li>
            </ul>
        </nav>
    </header>

    <main class="container">
        <section class="content-box">
            <h1>Kontakta Mig</h1>
            <p>Har du frågor eller vill du samarbeta? Fyll i formuläret nedan eller nå mig direkt via mina kontaktuppgifter.</p>

            <div class="contact-details">
                <p><strong>E-post:</strong> aaaaaaaaaaaaaa@gmail.com</p>
                <p><strong>Plats:</strong> Sverige</p>
            </div>

            <form action="#" method="post" class="contact-form">
                <div class="form-group">
                    <label for="name">Namn</label>
                    <input type="text" id="name" name="name" required>
                </div>

                <div class="form-group">
                    <label for="email">E-postadress</label>
                    <input type="email" id="email" name="email" required>
                </div>

                <div class="form-group">
                    <label for="message">Meddelande</label>
                    <textarea id="message" name="message" rows="5" required></textarea>
                </div>

                <button type="submit" class="btn btn-primary">Skicka Meddelande</button>
            </form>
        </section>
    </main>

    <footer class="site-footer">
        <p> 2026 Frehiwet Fishaye. Alla rättigheter förbehållna.</p>
    </footer>

</body>
</html>
